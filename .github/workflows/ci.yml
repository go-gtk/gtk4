name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gofmt:
    name: gofmt + tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: gofmt
        run: |
          u=$(gofmt -l .)
          if [ -n "$u" ]; then echo "::error::not gofmt-clean:"; echo "$u"; exit 1; fi
      - name: go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The real GTK4 lane: build and drive live GTK4 under a headless X server, the
  # same proof the feasibility spike established. libgtk-4-1 is the runtime; no
  # -dev package and no cgo — the binding dlopens it.
  linux:
    name: linux (real GTK4, CGO=0, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Install GTK4 runtime + a headless X server
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-1 xvfb xauth
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Live test on real GTK4
        # Xvfb has no GL: a popover is the first widget that really renders, and
        # without a software renderer epoxy aborts the whole test binary.
        run: xvfb-run -a env GDK_BACKEND=x11 GDK_DEBUG=gl-disable GSK_RENDERER=cairo go test -count=1 -v ./...

  # GTK 4.16 added GdkMemoryTextureBuilder's update-texture/update-region, and
  # ubuntu-latest (24.04) ships 4.14, so the lane above only proves the fallback.
  # Debian trixie ships 4.18: this lane REQUIRES the update path to be present.
  linux-new:
    name: linux (GTK 4.16+, update path required)
    runs-on: ubuntu-latest
    container: golang:1.27-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK4 runtime + a headless X server
        run: apt-get update && apt-get install -y --no-install-recommends libgtk-4-1 xvfb xauth
      - name: Live test, update path required
        run: xvfb-run -a env GDK_BACKEND=x11 GTK4_REQUIRE_UPDATE=1 CGO_ENABLED=0 go test -count=1 -v -run 'TestLiveUpdateRGBA|TestLiveSharedFrame|TestLiveOverlayAllocatedSize' ./...

  # The binding COMPILES everywhere (a consumer cross-compiles without a build
  # tag; off Linux Init returns ErrUnsupported).
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: android, goarch: arm64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...
